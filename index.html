<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- App favicon -->
    <link rel="shortcut icon" href="assets/fonts/LOGOicon.svg">

    <!-- Theme Config Js -->
    <script src="assets/js/hyper-config.js"></script>

    <!-- Vendor css -->
    <link href="assets/css/vendor.min.css" rel="stylesheet" type="text/css" />

    <!-- App css -->
    <link href="assets/css/app-creative.min.css" rel="stylesheet" type="text/css" id="app-style" />

    <!-- Icons css -->
    <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />
    
</head>
    <style>
        body{
             background: linear-gradient(135deg, #1e3c72, #2a5298, #00d2ff);
        }
        .login-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            width: 350px;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .login-container img {
            width: 100%;
            max-height: 80px;
            margin-bottom: 15px;
        }
        .shape {
            position: absolute;
            background: white;
            opacity: 0.2;
            filter: blur(10px);
            border-radius: 50%;
        }
        .shape:nth-child(1) {
            width: 150px; height: 150px; top: 10%; left: 15%;
        }
        .shape:nth-child(2) {
            width: 100px; height: 100px; bottom: 15%; right: 10%;
        }
        .shape:nth-child(3) {
            width: 120px; height: 120px; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
    </style>
<body>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="account-pages pt-2 pt-sm-5 pb-4 pb-sm-5 position-relative">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xxl-4 col-lg-5">
                    <div class="card">

                        <!-- Logo -->
                        <div class="card-header py-4 text-center bg-primary">
                            <a href="index.html">
                                <span><img src="assets/fonts/LOGOINGENIA.svg" alt="logo" height="22"></span>
                            </a>
                        </div>

                        <div class="card-body p-4">

                            <div class="text-center w-75 m-auto">
                                <h4 class="text-dark-50 text-center pb-0 fw-bold">SISTEMA ASISTENCIA RRHH</h4>
                                <p class="text-muted mb-4">Ingresa con tu cuenta</p>
                            </div>

                            <form id="login-form">

                                <div class="mb-3">
                                    <label for="usuario" class="form-label">Usuario</label>
                                    <input class="form-control" type="text" id="usuario" name="usuario" required="" placeholder="Ingresa tu usuario">
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label">Contraseña</label>
                                    <div class="input-group input-group-merge">
                                        <input type="password" id="password" class="form-control" name="password" placeholder="Ingresa tu contraseña">
                                       <div class="input-group-text" data-password="false">
                                             <span class="password-eye"></span>
                                         </div>
                                    </div>
                                </div>

                                <div class="mb-3 mb-0 text-center">
                                    <button class="btn btn-primary" type="submit"> Ingresar </button>
                                </div>

                            </form>
                            <div id="mensaje" class="mt-2 text-center text-danger"></div>
                        </div> <!-- end card-body -->
                    </div>
                    <!-- end card -->


                </div> <!-- end col -->
            </div>
            <!-- end row -->
        </div>
        <!-- end container -->
    </div>

    <script src="assets/js/vendor.min.js"></script>
    <script src="assets/js/app.min.js"></script>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!usuario || !password) {
                Swal.fire("Error", "Por favor ingresa tus credenciales", "error");
                return;
            }

            const formData = new URLSearchParams();
            formData.append("action", "login");
            formData.append("usuario", usuario);
            formData.append("password", password);

            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycbzgrJWImhY2AqUQ4t1hb8g5TL51pqgZVn1XqcKL2HWjDMoscwJ9FaqECAsKWR9Hv3MnLg/exec', {
                    method: 'POST',
                    body: formData,
                    headers: { "Content-Type": "application/x-www-form-urlencoded" }
                });

                const data = await response.json();

                if (data.success) {
                    Swal.fire({
                        title: "Bienvenido",
                        text: "Inicio de sesión exitoso",
                        icon: "success",
                        timer: 2000,
                        showConfirmButton: false
                    }).then(() => {
                        // Guarda los datos del usuario en localStorage
                            localStorage.setItem("usuario", JSON.stringify(data.usuario));
                        if (data.rol === "admin") {
                            window.location.href = "perfil-horario.html";
                        } else {
                            window.location.href = "trabajador.html";
                        }
                    });
                } else {
                    Swal.fire("Error", data.message || "Credenciales incorrectas", "error");
                }
            } catch (error) {
                Swal.fire("Error", "No se pudo conectar con el servidor", "error");
                console.error(error);
            }
        });
    </script>
</body>
</html>
