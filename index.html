<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298, #00d2ff);
            position: relative;
            overflow: hidden;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            width: 350px;
            text-align: center;
            position: relative;
            z-index: 10;
        }
        .login-container img {
            width: 100%;
            max-height: 80px;
            margin-bottom: 15px;
        }
        .shape {
            position: absolute;
            background: white;
            opacity: 0.2;
            filter: blur(10px);
            border-radius: 50%;
        }
        .shape:nth-child(1) {
            width: 150px; height: 150px; top: 10%; left: 15%;
        }
        .shape:nth-child(2) {
            width: 100px; height: 100px; bottom: 15%; right: 10%;
        }
        .shape:nth-child(3) {
            width: 120px; height: 120px; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
    </style>
<body class="d-flex justify-content-center align-items-center vh-100">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="login-container">
    <div class="card p-4" style="width: 300px;">
        <h4 class="text-center">Iniciar sesión</h4>
        <form id="login-form">
            <div class="mb-3">
                <label for="usuario" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="usuario" name="usuario" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
        <div id="mensaje" class="mt-2 text-center text-danger"></div>
    </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycbzgrJWImhY2AqUQ4t1hb8g5TL51pqgZVn1XqcKL2HWjDMoscwJ9FaqECAsKWR9Hv3MnLg/exec', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    alert("Usuario válido.");
                    // Aquí puedes redirigir a donde necesites
                    window.location.href = "www.google.com"; // Cambia esto por la URL de destino
                } else {
                    alert("Credenciales incorrectas o usuario no encontrado.");
                }
            } catch (error) {
                alert("Error de conexión con el servidor.");
                console.error(error);
            }
        });
    </script>
</body>
</html>
