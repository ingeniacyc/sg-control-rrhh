<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Horarios</title>
    
    <!-- Estilos de DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <!-- jQuery y DataTables -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
</head>
<body>
    <h2>Registro de Horarios</h2>
    <table id="tabla-horarios" class="display">
        <thead>
            <tr>
                <th>Usuario</th>
                <th>Día</th>
                <th>Horario Entrada</th>
                <th>Horario Salida</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        $(document).ready(function() {
            let url = "https://script.google.com/macros/s/AKfycbzgrJWImhY2AqUQ4t1hb8g5TL51pqgZVn1XqcKL2HWjDMoscwJ9FaqECAsKWR9Hv3MnLg/exec";

            fetch(url)
                .then(response => response.json())
                .then(datos => {
                    let tabla = $('#tabla-horarios').DataTable({
                        data: datos,
                        columns: [
                            { data: "Usuario" },
                            { data: "Día" },
                            { data: "Horario Entrada" },
                            { data: "Horario Salida" }
                        ],
                        language: {
                            url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/Spanish.json"
                        }
                    });
                })
                .catch(error => console.error("Error al obtener datos:", error));
        });
    </script>
</body>
</html>
