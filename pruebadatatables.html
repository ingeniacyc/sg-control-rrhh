<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h2 class="mb-4">Lista de Horarios</h2>
        <table id="tablaHorarios" class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Día</th>
                    <th>Entrada</th>
                    <th>Salida</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
    <script>
        let dataTableHorarios;

        function obtenerHorarios() {
            fetch('https://script.google.com/macros/s/AKfycbzgrJWImhY2AqUQ4t1hb8g5TL51pqgZVn1XqcKL2HWjDMoscwJ9FaqECAsKWR9Hv3MnLg/execT')
                .then(response => response.json())
                .then(data => renderizarTablaHorarios(data))
                .catch(error => console.error('Error al obtener los datos:', error));
        }

        function renderizarTablaHorarios(datos) {
            if (!dataTableHorarios) {
                dataTableHorarios = new DataTable('#tablaHorarios', {
                    paging: true,
                    searching: true,
                    info: true,
                    destroy: true,
                    order: [[0, "desc"]],
                    language: {
                        lengthMenu: "Mostrar _MENU_ registros por página",
                        zeroRecords: "No se encontraron registros",
                        info: "Mostrando _START_ a _END_ de _TOTAL_ registros",
                        infoEmpty: "No hay registros disponibles",
                        infoFiltered: "(filtrado de _MAX_ registros en total)",
                        search: "Buscar:",
                        paginate: {
                            first: "Primero",
                            last: "Último",
                            next: "Siguiente",
                            previous: "Anterior"
                        }
                    }
                });
            } else {
                dataTableHorarios.clear();
            }

            const newRows = datos.map(fila => [
                fila.id,
                fila.usuario,
                fila.dia,
                fila.entrada,
                fila.salida,
                fila.fecha,
                `<button class="btn btn-warning btn-sm" onclick="editarHorario(${fila.id})"><i class="fas fa-edit"></i></button>
                 <button class="btn btn-danger btn-sm" onclick="eliminarHorario(${fila.id})"><i class="fas fa-trash-alt"></i></button>`
            ]);
            
            dataTableHorarios.rows.add(newRows).draw();
        }

        function editarHorario(id) {
            alert('Editar horario con ID: ' + id);
        }
        
        function eliminarHorario(id) {
            alert('Eliminar horario con ID: ' + id);
        }

        document.addEventListener('DOMContentLoaded', obtenerHorarios);
    </script>
</body>
</html>
