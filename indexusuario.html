<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Archivo a Drive</title>
</head>
<body>
    <h1>Subir Archivo a Google Drive</h1>
    <form id="upload-form">
        <label for="archivo">Selecciona un archivo:</label>
        <input type="file" id="archivo" name="archivo" required>
        <button type="submit">Subir Archivo</button>
    </form>

    <p id="mensaje"></p>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxiF_FK99UiokvYN2X_2cVPlK4spURpjKH8Z2lfpkSFJPv7kFCX706194DfytiTpnd_/exec'; // Reemplaza con tu URL de Google Apps Script

        document.getElementById("upload-form").addEventListener("submit", function (event) {
            event.preventDefault();

            const archivo = document.getElementById("archivo").files[0];
            if (!archivo) {
                alert("Por favor, selecciona un archivo.");
                return;
            }

            const formData = new FormData();
            formData.append("action", "subirArchivo");
            formData.append("archivo", archivo);

            fetch(SCRIPT_URL, {
                method: "POST",
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById("mensaje").textContent = "Archivo subido correctamente. URL: " + data.url;
                    } else {
                        document.getElementById("mensaje").textContent = "Error: " + data.message;
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    document.getElementById("mensaje").textContent = "Error al subir el archivo.";
                });
        });
    </script>
</body>
</html>
